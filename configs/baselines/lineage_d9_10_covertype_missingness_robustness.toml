[calibration]
top_k = 2
selection_metric = "validation_auroc"
tie_break = "validation_ece"
methods = ["sigmoid", "isotonic"]
fit_split = "validation"

[[baseline]]
name = "lightgbm"
family = "boosted_trees"
handles_categorical = true
implementation = "lightgbm.LGBMClassifier"
uses_validation_split = true
n_estimators = 1000
learning_rate = 0.05
num_leaves = 31
subsample = 0.8
colsample_bytree = 0.8
early_stopping_rounds = 50
n_jobs = 4

[[baseline]]
name = "catboost"
family = "boosted_trees"
handles_categorical = true
implementation = "catboost.CatBoostClassifier"
uses_validation_split = true
iterations = 1000
learning_rate = 0.05
depth = 6
l2_leaf_reg = 3.0
early_stopping_rounds = 50
thread_count = 4

[[baseline]]
name = "logistic_regression"
family = "linear"
handles_categorical = false
implementation = "sklearn.linear_model.LogisticRegression"
uses_validation_split = false
max_iter = 1000
solver = "lbfgs"
C = 1.0

[[baseline]]
name = "random_forest"
family = "bagged_trees"
handles_categorical = false
implementation = "sklearn.ensemble.RandomForestClassifier"
uses_validation_split = false
n_estimators = 300
max_depth = 20
min_samples_leaf = 2
max_features = "sqrt"
n_jobs = 4

[[baseline]]
name = "xgboost"
family = "boosted_trees"
handles_categorical = false
implementation = "xgboost.XGBClassifier"
uses_validation_split = false
n_estimators = 400
max_depth = 6
learning_rate = 0.05
subsample = 0.8
colsample_bytree = 0.8
n_jobs = 4

[[baseline]]
name = "ft_transformer"
family = "deep_tabular"
handles_categorical = false
implementation = "lab.baselines.tabular.FTTransformerModule"
uses_validation_split = true
token_dim = 32
n_heads = 4
n_layers = 2
dropout = 0.1
learning_rate = 0.001
weight_decay = 0.0001
batch_size = 1024
max_epochs = 60
early_stopping_patience = 8
device = "cuda_if_available"

[[baseline]]
name = "tabpfn"
family = "tabular_foundation_model"
handles_categorical = false
implementation = "tabpfn.TabPFNClassifier"
uses_validation_split = false
max_train_rows = 10000
device = "auto"
allow_constant_fallback = true
